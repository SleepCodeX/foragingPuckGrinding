name: Build Hunting Helper
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build
      - name: Install virtual display
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null ||
             test "$(dpkg-query -W -f='${db:Status-Status}' libgl1-mesa-dri 2>/dev/null)" != installed; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          fi
      - name: Exercise packaged client trackers and controls
        run: xvfb-run -a ./gradlew --no-daemon runProductionClientGameTest
      - name: Upload validation captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tracker-validation
          path: |
            build/run/productionClientGameTest/screenshots/
            build/run/productionClientGameTest/logs/
            build/reports/tests/
      - name: Record source commit and artifact checksums
        run: |
          printf 'Repository: %s\nSource commit: %s\nJava: 25\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > build/libs/BUILD-INFO.txt
          cd build/libs
          sha256sum hunting-helper-*.jar > SHA256SUMS
      - name: Upload mod and sources
        uses: actions/upload-artifact@v7
        with:
          name: hunting-helper-mc26.2
          path: |
            build/libs/hunting-helper-*.jar
            build/libs/SHA256SUMS
            build/libs/BUILD-INFO.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: hunting-helper-mc26.2
          path: release-assets
      - name: Publish the tested version and visual guide
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          tag="v${version%%+*}"
          title="Hunting Helper ${version%%+*}"
          jar="hunting-helper-$version.jar"
          source="hunting-helper-$version-sources.jar"
          media="docs/media/${version%%+*}"
          test "$(sed -n 's/^Source commit: //p' release-assets/BUILD-INFO.txt)" = "$GITHUB_SHA"
          (cd release-assets && sha256sum -c SHA256SUMS)
          awk '/^# Hunting Helper / { sections++; if (sections > 1) exit } { print }' RELEASE-NOTES.md > /tmp/hunting-release-notes
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/hunting-release-state; then
            if test "$(cat /tmp/hunting-release-state)" = false; then
              echo "Preserving the published $tag release."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$title" --notes-file /tmp/hunting-release-notes
          fi
          gh release upload "$tag" "release-assets/$jar" "release-assets/$source" release-assets/SHA256SUMS release-assets/BUILD-INFO.txt "$media"/*.png "$media/menu-opening.gif" --clobber
          gh release edit "$tag" --target "$GITHUB_SHA" --draft=false --prerelease=false --latest --title "$title" --notes-file /tmp/hunting-release-notes
          gh release download "$tag" --pattern "$jar" --dir verified-download
          cmp "release-assets/$jar" "verified-download/$jar"

  capture_gallery:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/custom-tracker-studio'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/custom-tracker-studio
      - uses: actions/download-artifact@v8
        with:
          name: tracker-validation
          path: validation
      - name: Collect native captures for review
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          from PIL import Image
          shots = list(Path("validation").rglob("*.png"))
          out = Path("docs/media/1.5.0")
          out.mkdir(parents=True, exist_ok=True)
          def shot(name):
              return next(p for p in shots if name in p.stem)
          for name, file in {
              "tracker-menu-all": "settings",
              "tracker-menu-large": "large",
              "tracker-menu-compact": "compact",
              "line-color-dropdown": "colors",
              "all-five-trackers": "trackers",
              "nametag-parched-and-pollendart": "nametags",
              "custom-nametag-editor": "nametag-editor",
              "custom-mob-type-editor": "type-editor",
              "custom-tracker-library": "library",
              "custom-tracked-mobs": "custom-targets",
          }.items():
              copyfile(shot(name), out / (file + ".png"))
          frames = []
          for i in range(11):
              with Image.open(shot(f"menu-opening-{i:02d}")) as image:
                  frames.append(image.convert("RGB").resize((800,450), Image.Resampling.LANCZOS))
          frames[0].save(out / "menu-opening.gif", save_all=True, append_images=frames[1:],
                         duration=[40]*10+[1400], loop=0)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/1.5.0
          git diff --cached --quiet && exit 0
          git commit -m "Capture the 1.5.0 settings, editor and overlays in Minecraft"
          git push origin HEAD:codex/custom-tracker-studio
