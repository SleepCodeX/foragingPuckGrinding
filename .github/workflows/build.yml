name: Build Hunting Helper
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Exercise packaged client trackers and controls
        run: xvfb-run -a ./gradlew --no-daemon runProductionClientGameTest
      - name: Upload validation captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tracker-validation
          path: |
            build/run/productionClientGameTest/screenshots/
            build/run/productionClientGameTest/logs/
            build/reports/tests/
      - name: Record source commit and artifact checksums
        run: |
          printf 'Repository: %s\nSource commit: %s\nJava: 25\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > build/libs/BUILD-INFO.txt
          cd build/libs
          sha256sum hunting-helper-*.jar > SHA256SUMS
      - name: Upload mod and sources
        uses: actions/upload-artifact@v7
        with:
          name: hunting-helper-mc26.2
          path: |
            build/libs/hunting-helper-*.jar
            build/libs/SHA256SUMS
            build/libs/BUILD-INFO.txt
          if-no-files-found: error

  publish_1_3_0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: hunting-helper-mc26.2
          path: release-assets
      - name: Publish the built mod, source and checksums
        run: |
          if gh release view v1.3.0 --json isDraft --jq .isDraft > /tmp/hunting-release-state; then
            if test "$(cat /tmp/hunting-release-state)" = false; then
              echo 'Preserving the published 1.3.0 release.'
              exit 0
            fi
          else
            gh release create v1.3.0 --draft --target "$GITHUB_SHA" --title 'Hunting Helper 1.3.0' --notes-file RELEASE-NOTES.md
          fi
          gh release upload v1.3.0 release-assets/hunting-helper-1.3.0+mc26.2.jar release-assets/hunting-helper-1.3.0+mc26.2-sources.jar release-assets/SHA256SUMS release-assets/BUILD-INFO.txt --clobber
          gh release edit v1.3.0 --target "$GITHUB_SHA" --draft=false --prerelease=false --latest --title 'Hunting Helper 1.3.0' --notes-file RELEASE-NOTES.md
