name: Build Hunting Helper
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build
      - name: Install virtual display
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null ||
             test "$(dpkg-query -W -f='${db:Status-Status}' libgl1-mesa-dri 2>/dev/null)" != installed; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth libgl1-mesa-dri
          fi
      - name: Exercise packaged client trackers and controls
        run: xvfb-run -a ./gradlew --no-daemon runProductionClientGameTest
      - name: Upload validation captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tracker-validation
          path: |
            build/run/productionClientGameTest/screenshots/
            build/run/productionClientGameTest/logs/
            build/reports/tests/
      - name: Record source commit and artifact checksums
        run: |
          printf 'Repository: %s\nSource commit: %s\nJava: 25\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > build/libs/BUILD-INFO.txt
          cd build/libs
          sha256sum hunting-helper-*.jar > SHA256SUMS
      - name: Upload mod and sources
        uses: actions/upload-artifact@v7
        with:
          name: hunting-helper-mc26.2
          path: |
            build/libs/hunting-helper-*.jar
            build/libs/SHA256SUMS
            build/libs/BUILD-INFO.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: hunting-helper-mc26.2
          path: release-assets
      - name: Publish the tested version and visual guide
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version=//p' gradle.properties)
          tag="v${version%%+*}"
          title="Hunting Helper ${version%%+*}"
          jar="hunting-helper-$version.jar"
          source="hunting-helper-$version-sources.jar"
          (cd release-assets && sha256sum -c SHA256SUMS)
          awk '/^# Hunting Helper / { sections++; if (sections > 1) exit } { print }' RELEASE-NOTES.md > /tmp/hunting-release-notes
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/hunting-release-state; then
            if test "$(cat /tmp/hunting-release-state)" = false; then
              echo "Preserving the published $tag release."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$title" --notes-file /tmp/hunting-release-notes
          fi
          gh release upload "$tag" "release-assets/$jar" "release-assets/$source" release-assets/SHA256SUMS release-assets/BUILD-INFO.txt docs/media/1.4.0/settings.png docs/media/1.4.0/compact.png docs/media/1.4.0/colors.png docs/media/1.4.0/trackers.png docs/media/1.4.0/menu-opening.gif --clobber
          gh release edit "$tag" --target "$GITHUB_SHA" --draft=false --prerelease=false --latest --title "$title" --notes-file /tmp/hunting-release-notes
          gh release download "$tag" --pattern "$jar" --dir verified-download
          cmp "release-assets/$jar" "verified-download/$jar"

  capture_gallery:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/integrate-nametag-trackers'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/integrate-nametag-trackers
      - uses: actions/download-artifact@v4
        with:
          name: tracker-validation
          path: validation-captures
      - name: Prepare the native Minecraft visual guide
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          import shutil
          from PIL import Image
          root = Path("validation-captures")
          dest = Path("docs/media/1.4.0")
          dest.mkdir(parents=True, exist_ok=True)
          captures = {
              "tracker-menu-all": "settings", "tracker-menu-compact": "compact",
              "tracker-menu-large": "large", "line-color-dropdown": "colors",
              "all-five-trackers": "trackers", "nametag-parched-and-pollendart": "nametags"
          }
          for original, name in captures.items():
              matches = list(root.rglob(original + ".png"))
              assert len(matches) == 1, (original, matches)
              shutil.copyfile(matches[0], dest / (name + ".png"))
          paths = sorted(root.rglob("menu-opening-*.png"))
          assert len(paths) == 15, len(paths)
          frames = [Image.open(p).convert("RGB").quantize(colors=128) for p in paths]
          frames[0].save(dest / "menu-opening.gif", save_all=True, append_images=frames[1:],
                         duration=[40] * 14 + [1300], loop=0, disposal=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media/1.4.0
          if ! git diff --cached --quiet; then
            git commit -m 'Capture the matte charcoal settings and five-target overlays in Minecraft'
            git push origin HEAD:codex/integrate-nametag-trackers
          fi
