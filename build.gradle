plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}
base { archivesName = 'hunting-helper' }
loom {
    accessWidenerPath = file('src/main/resources/hunting-helper.accesswidener')
    splitEnvironmentSourceSets()
    mods {
        foragingpuckgrinding {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
fabricApi.configureTests {
    createSourceSet = true
    modId = 'foragingpuckgrinding-test'
    enableGameTests = false
    enableClientGameTests = true
}
// Sparkling Mutuals is compiled from source (src/client/kotlin, see docs/SM-UPSTREAM.md).
// Its Hypixel Mod API dependency comes from the same Maven repository upstream uses.
repositories {
    exclusiveContent {
        forRepository { maven { name = 'AzureAaron'; url = uri('https://maven.azureaaron.net/releases') } }
        filter { includeModule 'net.azureaaron', 'hm-api' }
    }
}
// Use the upstream Fabric jars intact so their nested dependencies, licenses and mod IDs survive packaging.
configurations {
    fabricBundle { canBeConsumed = false; transitive = false }
    kotlinBundle { canBeConsumed = false; transitive = false }
}
def kotlinHash = '620c2709be2a262b837cf976f6f85f6eda80a56af2ba4242e0bdc83a60fee7a5'
dependencies {
    kotlinBundle "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}@jar"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // The production Fabric API excludes the development-only client test runner.
    productionRuntimeMods(fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)) { transitive = false }
    fabricBundle "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}@jar"
    // Packaged as the intact upstream JAR through kotlinBundle below; this puts the Kotlin
    // language adapter and libraries on the compile and development runtime classpaths.
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    implementation include("net.azureaaron:hm-api:${project.hm_api_version}")
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('gametestJar', Jar) {
    archiveClassifier = 'gametest'
    destinationDirectory = layout.buildDirectory.dir('gametest')
    from sourceSets.gametest.output
}

// Keep the official production launcher usable under Windows command-line limits.
abstract class PackagedClientTest extends net.fabricmc.loom.task.prod.ClientProductionRunTask {
    @Override
    protected void configureClasspath(org.gradle.process.ExecSpec command) {
        def paths = streamClasspath().map { it.absolutePath.replace('\\', '/') }
                .collect(java.util.stream.Collectors.joining(File.pathSeparator))
        def argumentsFile = new File(temporaryDir, 'classpath.args')
        argumentsFile.parentFile.mkdirs()
        argumentsFile.setText('-cp\n"' + paths + '"\n', 'UTF-8')
        command.args('@' + argumentsFile.absolutePath)
    }
}

tasks.register('deleteProductionGameTestRunDir', Delete) {
    delete layout.buildDirectory.dir('run/productionClientGameTest')
}

tasks.register('runProductionClientGameTest', PackagedClientTest) {
    dependsOn tasks.named('deleteProductionGameTestRunDir')
    mods.from tasks.named('gametestJar')
    jvmArgs.add('-Dfabric.client.gametest')
    runDir = layout.buildDirectory.dir('run/productionClientGameTest')
}
processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand 'version': modVersion }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25 } }
// The Sparkling Mutuals unit tests live in the test source set but exercise client code,
// including Kotlin internal members, as they did upstream.
kotlin.target.compilations.named('test') { associateWith(kotlin.target.compilations.getByName('client')) }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
test { useJUnitPlatform() }
abstract class VerifyBundledMods extends DefaultTask {
    @InputFiles abstract ConfigurableFileCollection getFabricFiles()
    @InputFiles abstract ConfigurableFileCollection getKotlinFiles()
    @Input abstract Property<String> getFabricDigest()
    @Input abstract Property<String> getKotlinDigest()

    @TaskAction void verify() {
        checkFile(fabricFiles.singleFile, fabricDigest.get())
        checkFile(kotlinFiles.singleFile, kotlinDigest.get())
    }

    private static void checkFile(File file, String expected) {
        String actual = java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
        if (actual != expected) throw new GradleException("Checksum mismatch for ${file.name}: ${actual}")
    }
}
def checkEmbedded = tasks.register('verifyBundledMods', VerifyBundledMods) {
    fabricFiles.from(configurations.fabricBundle)
    fabricDigest.set('e5b858ceb13290c274e31cb888ff5a1a40cb91067e7ffab0b5b775aec51e216a')
    kotlinFiles.from(configurations.kotlinBundle)
    kotlinDigest.set(kotlinHash)
}
jar {
    dependsOn checkEmbedded
    from(configurations.fabricBundle) { into 'META-INF/jars'; rename { 'fabric-api.jar' } }
    from(configurations.kotlinBundle) { into 'META-INF/jars'; rename { 'fabric-language-kotlin.jar' } }
    from('LICENSE', 'NOTICE')
    from('licenses') { into 'licenses' }
}
sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.client.allSource
    from('LICENSE', 'NOTICE')
    from('licenses') { into 'licenses' }
}

tasks.register('replaySafariLogs', JavaExec) {
    group = 'verification'
    description = 'Print Safari run reports from a Minecraft logs directory.'
    dependsOn tasks.named('clientClasses')
    classpath = sourceSets.client.runtimeClasspath
    mainClass = 'dev.sleepcodex.foragingpuckgrinding.journal.importer.LogReplayMain'
    if (providers.gradleProperty('logs').isPresent()) args providers.gradleProperty('logs').get()
}
